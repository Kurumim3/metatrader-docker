[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_RESOLUTION)s -ac -nolisten tcp -noreset
priority=10
autorestart=true
startsecs=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fluxbox]
command=bash -c "for i in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && exec fluxbox; sleep 1; done; exit 1"
environment=DISPLAY=":99"
priority=20
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:x11vnc]
command=bash -c "for i in $(seq 1 30); do xdpyinfo -display :99 >/dev/null 2>&1 && exec x11vnc -display :99 -forever -rfbport 5900 -localhost -passwdfile /tmp/vnc.pass -noxdamage -nolookup -quiet; sleep 1; done; exit 1"
priority=30
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mt4]
command=/opt/mt/bin/run-terminal mt4
environment=DISPLAY=":99"
priority=50
autorestart=true
startsecs=15
startretries=10
stopsignal=TERM
stopwaitsecs=45
killasgroup=false
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:mt5]
command=/opt/mt/bin/run-terminal mt5
environment=DISPLAY=":99"
priority=60
autorestart=true
startsecs=15
startretries=10
stopsignal=TERM
stopwaitsecs=45
killasgroup=false
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
